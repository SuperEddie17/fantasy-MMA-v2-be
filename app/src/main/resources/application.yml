micronaut:
  application:
    name: fight-exchange
  server:
    port: ${PORT:8080}
    # History CSV uploads (the UFC dataset is several MB).
    max-request-size: 64MB
    multipart:
      max-file-size: 64MB

  security:
    authentication: bearer
    # Reading is public; /admin needs a JWT from POST /login with ROLE_ADMIN; the player's own data
    # (profile, portfolios, trades) needs a JWT from POST /api/v1/auth/login.
    intercept-url-map:
      - pattern: /api/v1/admin/**
        access:
          - ROLE_ADMIN
      - pattern: /api/v1/me
        access:
          - isAuthenticated()
      - pattern: /api/v1/portfolios
        access:
          - isAuthenticated()
      - pattern: /api/v1/portfolios/**
        access:
          - isAuthenticated()
      - pattern: /**
        access:
          - isAnonymous()
    token:
      jwt:
        signatures:
          secret:
            generator:
              # Without JWT_SECRET a random secret is used (tokens die with the process).
              secret: ${JWT_SECRET:`${random.uuid}${random.uuid}`}

# Single static admin account for /login (player accounts live in app_user, see AuthController). Login is refused while the password is blank.
admin:
  username: ${ADMIN_USER:admin}
  password: ${ADMIN_PASSWORD:}

datasources:
  default:
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/fightexchange`}
    username: ${DB_USER:fightexchange}
    password: ${DB_PASSWORD:fightexchange}
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    dialect: POSTGRES

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration

endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS

ingest:
  ufcalendar:
    # The adapter exists only with a key (https://www.ufcalendar.com/account/api); the free plan has 1,000 requests a month.
    api-key: ${UFCALENDAR_API_KEY:}
    # Webhook endpoint exists only with a secret (Pro plan); deliveries older than the tolerance are refused.
    webhook-secret: ${UFCALENDAR_WEBHOOK_SECRET:}
    webhook-tolerance-seconds: 300
    base-url: ${UFCALENDAR_BASE_URL:`https://api.ufcalendar.com`}
    orgs: ufc,pfl,oktagon
    days-ahead: 90
    days-back: 7
  confirmation:
    # Event types from non-admin sources that wait for an admin decision (source ADMIN is trusted).
    required-types:
      - bout.result
      - bout.cancelled
