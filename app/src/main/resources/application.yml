micronaut:
  application:
    name: fight-exchange
  server:
    port: ${PORT:8080}
    # History CSV uploads (the UFC dataset is several MB).
    max-request-size: 64MB
    multipart:
      max-file-size: 64MB

  security:
    authentication: bearer
    # Public API stays open; everything under /admin needs a JWT from POST /login with ROLE_ADMIN.
    intercept-url-map:
      - pattern: /api/v1/admin/**
        access:
          - ROLE_ADMIN
      - pattern: /**
        access:
          - isAnonymous()
    token:
      jwt:
        signatures:
          secret:
            generator:
              # Without JWT_SECRET a random secret is used (tokens die with the process).
              secret: ${JWT_SECRET:`${random.uuid}${random.uuid}`}

# Single static admin account (full accounts come in F3). Login is refused while the password is blank.
admin:
  username: ${ADMIN_USER:admin}
  password: ${ADMIN_PASSWORD:}

datasources:
  default:
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/fightexchange`}
    username: ${DB_USER:fightexchange}
    password: ${DB_PASSWORD:fightexchange}
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    dialect: POSTGRES

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration

endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS

ingest:
  confirmation:
    # Event types from non-admin sources that wait for an admin decision (source ADMIN is trusted).
    required-types:
      - bout.result
      - bout.cancelled
